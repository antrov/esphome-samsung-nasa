    message: 0x42E9
    nasa_device_id: nasa_device_1
    name: "Flow"
    unit_of_measurement: lpm
    device_class: water
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:pump
  # was: water_outlet_zone1_temperature
