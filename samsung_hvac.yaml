# --- COP of the current hour and day (published to "COP - Hourly" / "COP - Daily" above) ---
# COP = heat produced / electricity consumed, from the lifetime counters 0x4427 and 0x8414.
# Not integrated from the power readings, as the README examples do: the unit keeps counting while
# the ESP is offline or misses a message, so a reboot or an OTA update does not lose any energy.
# At the start of every hour / day the counters are stored as a baseline, and
#   COP = (heat - heat0) / (elec - elec0)
# The baseline is kept over reboots (restore_value). If the stored period is not the current one
# any more (the device was off over the turn of the hour / day) a new period starts from the
# current counters.
globals:
  - id: cop_hour_id  # UTC hour number the baseline belongs to
    type: int
    restore_value: true
    initial_value: "-1"
  - id: cop_hour_heat0  # 0x4427 [kWh] at the start of the hour
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: cop_hour_elec0  # 0x8414 [kWh] at the start of the hour
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: cop_day_id  # local date (year * 1000 + day of the year) the baseline belongs to
    type: int
    restore_value: true
    initial_value: "-1"
  - id: cop_day_heat0  # 0x4427 [kWh] at the start of the day
    type: float
    restore_value: true
    initial_value: "NAN"
  - id: cop_day_elec0  # 0x8414 [kWh] at the start of the day
    type: float
    restore_value: true
    initial_value: "NAN"

interval:
  - interval: 60s
    then:
      - lambda: |-
          auto now = id(homeassistant_time).now();
          if (!now.is_valid()) return;  // clock not synchronised with Home Assistant yet
          const float heat = id(heat_pump_produced_energy).state;    // kWh, lifetime
          const float elec = id(heat_pump_cumulative_energy).state;  // kWh, lifetime
          if (std::isnan(heat) || std::isnan(elec)) return;          // no data from the heat pump yet

          // COP of the period `period` (any number that changes when the period changes). A new
          // period, a missing baseline or a counter that went backwards (re)starts the baseline.
          auto period_cop = [&](int period, int &stored, float &heat0, float &elec0, float min_kwh) -> float {
            if (period != stored || std::isnan(heat0) || std::isnan(elec0) || heat < heat0 || elec < elec0) {
              stored = period;
              heat0 = heat;
              elec0 = elec;
              return NAN;
            }
            const float used = elec - elec0;
            if (used < min_kwh) return NAN;  // the heat pump has not really run in this period yet
            float cop = (heat - heat0) / used;
            if (cop > 8.0f) cop = 8.0f;      // same limits as the README examples
            if (cop < 0.0f) cop = 0.0f;
            return cop;
          };

          // Hours are UTC hours: the same as local hours for time zones with a whole-hour offset.
          id(cop_hourly).publish_state(period_cop(now.timestamp / 3600, id(cop_hour_id),
              id(cop_hour_heat0), id(cop_hour_elec0), ${cop_min_kwh_hourly}));
          id(cop_daily).publish_state(period_cop(now.year * 1000 + now.day_of_year, id(cop_day_id),
              id(cop_day_heat0), id(cop_day_elec0), ${cop_min_kwh_daily}));
