# Heat pump configuration migrated from antrov/esphome_samsung_hvac_bus (component
# "samsung_ac", file esphome_samsung_hvac_bus.yaml) to this component "samsung_nasa".
#
# Home Assistant identifies an ESPHome entity by device MAC + platform + the hash of the
# entity NAME. To keep every entity (entity_id, history, statistics, automations, dashboards)
# the device name, the entity names and the platform of each entity are kept exactly as before.
# Do not rename anything here without reading MIGRATION.md.

esphome:
  name: samsung_hvac
  friendly_name: Samsung HVAC
  min_version: 2026.5.0

esp32:
  board: m5stack-atom
  framework:
    type: arduino

# Import external component from GitHub (this fork / branch)
external_components:
  - source:
      type: git
      url: https://github.com/antrov/esphome-samsung-nasa
      ref: claude/bold-tesla-l2fjw5
    components: [samsung_nasa]

# [Optional] - Create web interface where you can control the heat pump from your web browser
web_server:
  port: 80

# Enable logging
logger:
  logs:
    component: ERROR

# Enable Home Assistant API (no encryption key, as before - otherwise Home Assistant asks to re-authenticate)
api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap: {}

captive_portal:

# M5Atom Lite + ATOM Tail485 (board m5stack-atom). The Tail485 converter switches the RS485
# direction by itself, so no flow_control_pin is needed. Pins: TX = G26, RX = G32.
# (For ATOM Lite + Atom RS485 Base use tx_pin: GPIO19 and rx_pin: GPIO22 instead.)
uart:
  tx_pin: GPIO26
  rx_pin: GPIO32
  baud_rate: 9600
  parity: EVEN

## SAMSUNG NASA CONFIGURATION
samsung_nasa:
  # Both were enabled in the previous configuration (the non_nasa_keepalive option does not exist
  # here: this component speaks NASA only)
  debug_log_messages: true
  debug_log_undefined_messages: true
  nasa_client: {}
  devices:
    # 0x4xxx messages come from the indoor (hydro) unit, 0x8xxx and 0x24xx from the outdoor unit
    - address: 20.00.00
      id: nasa_device_1
    - address: 10.00.00
      id: nasa_device_2

sensor:
  # --- Outdoor unit (10.00.00) ---
  # was: error_code
  - platform: samsung_nasa
    message: 0x8235
    nasa_device_id: nasa_device_2
    name: "error_code"
  # was: outdoor_instantaneous_power
  - platform: samsung_nasa
    message: 0x8413
    nasa_device_id: nasa_device_2
    name: "Outdoor Instantaneous Power"
  # was: outdoor_cumulative_energy
  - platform: samsung_nasa
