    nasa_device_id: nasa_device_2
    name: "Outdoor Cumulative Energy"
  # was: outdoor_current
  - platform: samsung_nasa
    message: 0x8217
    nasa_device_id: nasa_device_2
    name: "Outdoor Current"
    icon: mdi:current-ac
  # was: outdoor_voltage
  - platform: samsung_nasa
    message: 0x24FC
    nasa_device_id: nasa_device_2
    name: "Outdoor Voltage"
  # was: outdoor_temperature
  - platform: samsung_nasa
    message: 0x8204
    nasa_device_id: nasa_device_2
    name: "Outdoor temperature"

  # --- Indoor (hydro) unit (20.00.00) ---
  # The previous file listed these under 10.00.00 (as in the upstream example), but the
  # unit reports 0x4xxx messages itself, so they are read from 20.00.00 here.
  # was: water_temperature
  - platform: samsung_nasa
    message: 0x4237
    nasa_device_id: nasa_device_1
    name: "Warm water"

  # --- Added in the fork's code (main branch), not in esphome_samsung_hvac_bus.yaml ---
  # Names confirmed against the entity list in Home Assistant.
  # Attributes (unit, device_class, state_class, icon, scaling) are the fork's, unchanged.
  # was: flow
  - platform: samsung_nasa
    message: 0x42E9
    nasa_device_id: nasa_device_1
    name: "Flow"
    unit_of_measurement: lpm
    device_class: water
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:pump
  # was: water_outlet_zone1_temperature
  - platform: samsung_nasa
    message: 0x42D8
    nasa_device_id: nasa_device_1
    name: "Water Outlet Zone 1"
    unit_of_measurement: °C
    device_class: water
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-water
    filters:
      - multiply: 0.1
  # was: water_outlet_zone2_temperature
  - platform: samsung_nasa
    message: 0x42D9
    nasa_device_id: nasa_device_1
    name: "Water Outlet Zone 2"
    unit_of_measurement: °C
    device_class: water
    state_class: measurement
    accuracy_decimals: 1
    icon: mdi:thermometer-water
    filters:
      - multiply: 0.1

